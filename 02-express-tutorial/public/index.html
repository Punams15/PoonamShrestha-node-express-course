<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <style>
    body {font-family: Arial, sans-serif;padding: 20px;}
    .product {border: 3px solid #309259;padding: 10px;margin-bottom: 10px;border-radius: 5px;}
    .product img {max-width: 150px;display: block;margin-bottom: 5px;}
     </style>

</head>
<body>
    <h1>Welcome to my 1st express Lesson!</h1>
    <button id="load">Load Products</button>
    <div id="output"></div>  
</body>
  <script>
    document.getElementById("load").onclick = async () => {
      const res = await fetch("/api/v1/products");
      const products = await res.json();
      
      const output = document.getElementById("output");
      output.innerHTML = ""; // clear previous output

      products.forEach(p => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `
          <h3>${p.name}</h3>
          <img src="${p.image}" alt="${p.name}">
          <p>Price: $${p.price}</p>
          <p>${p.desc}</p>
        `;
        output.appendChild(div);
      });
    };
  </script>
</html>
